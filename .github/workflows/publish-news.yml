name: Publish scheduled news

# Every day at 14:00 UTC (9 am Central), publish any Recognition items in
# _scheduled/news.json whose date has arrived. Run it by hand from the Actions tab too.
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish due items
        run: python3 _scheduled/publish.py
      - name: Commit and push
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add recognition.html sitemap.xml _scheduled/news.json
            git commit -m "News: publish scheduled Recognition item"
            git push
          fi
